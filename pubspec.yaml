name: life_tracker
description: A comprehensive personal life tracker app for managing health, finance, notes, and reminders. Track your weight, medications, expenses, income, debts, bills, commitments, and stay organized with notes and reminders - all in one place.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  audioplayers: ^6.0.0
  cached_network_image: ^3.3.1
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.5
  file_picker: ^8.0.6
  fl_chart: ^0.68.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.11
  flutter_local_notifications: ^17.2.1+2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  health: ^13.2.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  json_annotation: ^4.9.0
  local_auth: ^2.2.0
  local_auth_android: ^1.0.47
  local_auth_darwin: ^1.4.1
  package_info_plus: ^9.0.0
  path: ^1.9.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.0
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.5.3
  timezone: ^0.9.3
  url_launcher: ^6.3.2
  uuid: ^4.4.1

  # Audio recording
  open_filex: ^4.5.0
  flutter_sound: ^9.16.3  # For voice recording

dev_dependencies:
  # Dev dependencies (sorted alphabetically)
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  integration_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0
  mockito: ^5.4.4
  riverpod_generator: ^2.4.0

  flutter_local_notifications_platform_interface: any
flutter:
  uses-material-design: true

  # Assets
  # No assets for now - will add when needed
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Fonts - using Google Fonts package instead of local fonts
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf

  # Internationalization
  generate: true